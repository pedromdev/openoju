# =============================================================================
# Minimal: um nó, tudo embutido, sem TLS. Bom para avaliação e laboratório.
#
#   helm upgrade --install openoju deploy/helm/openoju \
#     -n openoju --create-namespace -f values-minimal.yaml \
#     --set config.OJU_PUBLIC_BASE_URL=http://localhost:8000 \
#     --set config.OJU_CORS_ORIGINS=http://localhost:8000 \
#     --set config.OJU_COOKIE_SECURE=false
# =============================================================================

replicaCount:
  api: 1
  worker: 1
  dispatcher: 1
  maintenance: 1

secrets:
  create: true

config:
  OJU_PUBLIC_BASE_URL: http://localhost:8000
  OJU_FRONTEND_BASE_URL: http://localhost:8000
  OJU_CORS_ORIGINS: http://localhost:8000
  OJU_COOKIE_SECURE: "false"
  OJU_STORAGE_BACKEND: s3
  OJU_S3_ENDPOINT: http://localhost:9000
  OJU_S3_INTERNAL_ENDPOINT: http://openoju-openoju-minio:9000
  OJU_S3_BUCKET: openoju
  OJU_S3_CREATE_BUCKET: "false"
  OJU_RATE_LIMIT_BACKEND: memory

postgresql:
  enabled: true

minio:
  enabled: true

media:
  mode: emptyDir
  emptyDir:
    sizeLimit: 10Gi

data:
  mode: emptyDir

vaapi:
  enabled: false

pdb:
  enabled: false
