# =============================================================================
# AWS: EKS + RDS Postgres + S3 + ALB
#
# Preencha os valores com os outputs do stack Terraform (deploy/terraform/stacks/aws)
# ou deixe o wizard `scripts/provision.py` gerar este arquivo.
# =============================================================================

replicaCount:
  api: 2
  worker: 2
  dispatcher: 1
  maintenance: 1

image:
  repository: ghcr.io/pedromdev/openoju
  tag: "0.3.0"

serviceAccount:
  create: true
  # Role IRSA criada pelo Terraform (módulo deps-aws).
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::000000000000:role/openoju-s3

existingSecret: openoju-secrets
secrets:
  create: false

config:
  OJU_PUBLIC_BASE_URL: https://openoju.example.com
  OJU_FRONTEND_BASE_URL: https://openoju.example.com
  OJU_CORS_ORIGINS: https://openoju.example.com
  OJU_STORAGE_BACKEND: s3
  OJU_S3_ENDPOINT: https://s3.us-east-1.amazonaws.com
  OJU_S3_INTERNAL_ENDPOINT: ""
  OJU_S3_BUCKET: openoju-prod
  OJU_S3_REGION: us-east-1
  OJU_S3_CREATE_BUCKET: "false"
  OJU_RATE_LIMIT_BACKEND: postgres

media:
  mode: emptyDir
  emptyDir:
    sizeLimit: 50Gi

data:
  mode: emptyDir

vaapi:
  enabled: false

ingress:
  enabled: true
  className: alb
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:us-east-1:000000000000:certificate/00000000-0000-0000-0000-000000000000
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/load-balancer-attributes: idle_timeout.timeout_seconds=3600
  hosts:
    - host: openoju.example.com
      paths:
        - path: /
          pathType: Prefix

pdb:
  enabled: true

# Worker precisa de CPU; mantenha separado do pool da API.
nodeSelector:
  openoju.io/pool: app
tolerations: []

networkPolicy:
  enabled: true
  allowDNS: true
