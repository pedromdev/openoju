# =============================================================================
# GCP: GKE + Cloud SQL + GCS (modo interoperabilidade) + GCLB/ingress-nginx
#
# O GCS exige HMAC keys (interoperabilidade) para o SDK S3 usado pela aplicação.
# O endpoint interno e o público são o mesmo; use `storage.googleapis.com`.
# =============================================================================

replicaCount:
  api: 2
  worker: 2
  dispatcher: 1
  maintenance: 1

serviceAccount:
  create: true
  # GSA vinculada via Workload Identity (Terraform: deps-gcp).
  annotations:
    iam.gke.io/gcp-service-account: openoju-s3@my-project.iam.gserviceaccount.com

secrets:
  create: false

config:
  OJU_PUBLIC_BASE_URL: https://openoju.example.com
  OJU_FRONTEND_BASE_URL: https://openoju.example.com
  OJU_CORS_ORIGINS: https://openoju.example.com
  OJU_STORAGE_BACKEND: s3
  OJU_S3_ENDPOINT: https://storage.googleapis.com
  OJU_S3_INTERNAL_ENDPOINT: https://storage.googleapis.com
  OJU_S3_BUCKET: openoju-prod
  OJU_S3_REGION: auto
  OJU_S3_CREATE_BUCKET: "false"
  OJU_RATE_LIMIT_BACKEND: postgres

media:
  mode: emptyDir
  emptyDir:
    sizeLimit: 50Gi

data:
  mode: emptyDir

vaapi:
  enabled: false

ingress:
  enabled: true
  className: gce
  annotations:
    kubernetes.io/ingress.global-static-ip-name: openoju-ip
    networking.gke.io/managed-certificates: openoju-cert
    kubernetes.io/ingress.allow-http: "false"
  hosts:
    - host: openoju.example.com
      paths:
        - path: /
          pathType: Prefix

pdb:
  enabled: true

nodeSelector:
  openoju.io/pool: app

networkPolicy:
  enabled: true
  allowDNS: true
