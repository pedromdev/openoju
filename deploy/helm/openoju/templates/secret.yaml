{{- if .Values.secrets.create }}
{{- $name := include "openoju.secretName" . }}
{{- $fullname := include "openoju.fullname" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $pgPassword := "" }}
{{- if .Values.postgresql.enabled }}
{{- if and $existing (hasKey $existing.data "postgres-password") }}
{{- $pgPassword = index $existing.data "postgres-password" | b64dec }}
{{- else }}
{{- $pgPassword = randAlphaNum 32 }}
{{- end }}
{{- end }}
{{- $databaseUrl := .Values.secrets.databaseUrl }}
{{- if and (not $databaseUrl) .Values.postgresql.enabled }}
{{- $databaseUrl = printf "postgresql+psycopg://%s:%s@%s-postgresql:5432/%s" .Values.postgresql.auth.username $pgPassword $fullname .Values.postgresql.auth.database }}
{{- end }}
{{- if not $databaseUrl }}
{{- $databaseUrl = "postgresql+psycopg://change-me:change-me@postgresql:5432/openoju" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "openoju.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
    {{- with .Values.secrets.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
type: Opaque
data:
  {{- if and $existing (hasKey $existing.data "OJU_DATABASE_URL") }}
  OJU_DATABASE_URL: {{ index $existing.data "OJU_DATABASE_URL" }}
  {{- else }}
  OJU_DATABASE_URL: {{ $databaseUrl | b64enc | quote }}
  {{- end }}
  {{- if and $existing (hasKey $existing.data "OJU_SECRET_KEY") }}
  OJU_SECRET_KEY: {{ index $existing.data "OJU_SECRET_KEY" }}
  {{- else }}
  OJU_SECRET_KEY: {{ randAlphaNum 48 | b64enc | quote }}
  {{- end }}
  {{- if and $existing (hasKey $existing.data "OJU_FERNET_KEY") }}
  OJU_FERNET_KEY: {{ index $existing.data "OJU_FERNET_KEY" }}
  {{- else }}
  OJU_FERNET_KEY: {{ randAlphaNum 32 | b64enc | quote }}
  {{- end }}
  {{- if and $existing (hasKey $existing.data "OJU_SETUP_TOKEN") }}
  OJU_SETUP_TOKEN: {{ index $existing.data "OJU_SETUP_TOKEN" }}
  {{- else }}
  OJU_SETUP_TOKEN: {{ randAlphaNum 24 | b64enc | quote }}
  {{- end }}
  {{- if and $existing (hasKey $existing.data "OJU_S3_ACCESS_KEY") }}
  OJU_S3_ACCESS_KEY: {{ index $existing.data "OJU_S3_ACCESS_KEY" }}
  {{- else }}
  OJU_S3_ACCESS_KEY: {{ randAlphaNum 20 | b64enc | quote }}
  {{- end }}
  {{- if and $existing (hasKey $existing.data "OJU_S3_SECRET_KEY") }}
  OJU_S3_SECRET_KEY: {{ index $existing.data "OJU_S3_SECRET_KEY" }}
  {{- else }}
  OJU_S3_SECRET_KEY: {{ randAlphaNum 40 | b64enc | quote }}
  {{- end }}
  {{- if .Values.postgresql.enabled }}
  {{ .Values.postgresql.auth.passwordKey }}: {{ $pgPassword | b64enc | quote }}
  {{- end }}
{{- end }}
