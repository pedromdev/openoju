apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "openoju.fullname" . }}-api
  labels:
    {{- include "openoju.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.replicaCount.api }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "openoju.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "openoju.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: api
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "openoju.serviceAccountName" . }}
      {{- include "openoju.imagePullSecrets" . | nindent 6 }}
      securityContext:
        {{- include "openoju.podSecurityContext" . | nindent 8 }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      containers:
        - name: api
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          image: "{{ include "openoju.image" . }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["sh", "-c", "uvicorn app.main:app --host 0.0.0.0 --port 8000"]
          {{- include "openoju.env" . | nindent 10 }}
          ports:
            - name: http
              containerPort: 8000
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: {{ .Values.probes.api.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.api.readiness.periodSeconds }}
            failureThreshold: {{ .Values.probes.api.readiness.failureThreshold }}
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: {{ .Values.probes.api.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.api.liveness.periodSeconds }}
            failureThreshold: {{ .Values.probes.api.liveness.failureThreshold }}
          volumeMounts:
            {{- include "openoju.volumeMounts" . | nindent 12 }}
            {{- include "openoju.vaapiMount" . | nindent 12 }}
          resources:
            {{- toYaml .Values.resources.api | nindent 12 }}
      volumes:
        {{- include "openoju.volumes" . | nindent 8 }}
        {{- include "openoju.vaapiVolume" . | nindent 8 }}
      {{- include "openoju.scheduling" . | nindent 6 }}
