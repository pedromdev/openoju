{{- if .Values.minio.enabled }}
{{- $name := include "openoju.fullname" . }}
{{- $secret := include "openoju.secretName" . }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}-minio
  labels:
    {{- include "openoju.labels" . | nindent 4 }}
    app.kubernetes.io/component: minio
spec:
  selector:
    app.kubernetes.io/name: {{ include "openoju.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: minio
  ports:
    - name: s3
      port: 9000
      targetPort: s3
    - name: console
      port: 9001
      targetPort: console
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}-minio
  labels:
    {{- include "openoju.labels" . | nindent 4 }}
    app.kubernetes.io/component: minio
spec:
  serviceName: {{ $name }}-minio
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "openoju.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: minio
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "openoju.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: minio
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: minio
          image: "{{ .Values.minio.image }}"
          imagePullPolicy: {{ .Values.minio.imagePullPolicy }}
          command:
            {{- toYaml .Values.minio.command | nindent 12 }}
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: {{ $secret }}
                  key: {{ .Values.minio.accessKeyKey }}
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $secret }}
                  key: {{ .Values.minio.secretKeyKey }}
            - name: MINIO_SERVER_URL
              value: {{ index .Values.config "OJU_S3_ENDPOINT" | quote }}
            - name: MINIO_BROWSER
              value: "off"
          ports:
            - name: s3
              containerPort: 9000
            - name: console
              containerPort: 9001
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: s3
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: s3
            initialDelaySeconds: 30
            periodSeconds: 30
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            {{- toYaml .Values.minio.resources | nindent 12 }}
      volumes:
        - name: data
        {{- if .Values.minio.persistence.existingClaim }}
          persistentVolumeClaim:
            claimName: {{ .Values.minio.persistence.existingClaim }}
        {{- else }}
          persistentVolumeClaim:
            claimName: {{ $name }}-minio
        {{- end }}
{{- if not .Values.minio.persistence.existingClaim }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $name }}-minio
  labels:
    {{- include "openoju.labels" . | nindent 4 }}
    app.kubernetes.io/component: minio
spec:
  accessModes: ["ReadWriteOnce"]
  {{- if .Values.minio.persistence.storageClassName }}
  storageClassName: {{ .Values.minio.persistence.storageClassName }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.minio.persistence.size }}
{{- end }}
{{- if .Values.minio.initBucket.enabled }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $name }}-minio-init
  labels:
    {{- include "openoju.labels" . | nindent 4 }}
    app.kubernetes.io/component: minio-init
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "10"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "openoju.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: minio-init
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mc
          image: "{{ .Values.minio.initBucket.image }}"
          command:
            - sh
            - -c
            - |
              set -e
              until mc alias set local "http://{{ $name }}-minio:9000" "$ACCESS" "$SECRET"; do
                echo "aguardando MinIO..."; sleep 3
              done
              mc mb --ignore-existing "local/$BUCKET"
              mc anonymous set none "local/$BUCKET" || true
          env:
            - name: ACCESS
              valueFrom:
                secretKeyRef:
                  name: {{ $secret }}
                  key: {{ .Values.minio.accessKeyKey }}
            - name: SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $secret }}
                  key: {{ .Values.minio.secretKeyKey }}
            - name: BUCKET
              value: {{ index .Values.config "OJU_S3_BUCKET" | quote }}
{{- end }}
{{- end }}
