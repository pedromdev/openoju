apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "openoju.fullname" . }}-worker
  labels:
    {{- include "openoju.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.replicaCount.worker }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "openoju.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "openoju.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: worker
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "openoju.serviceAccountName" . }}
      {{- include "openoju.imagePullSecrets" . | nindent 6 }}
      securityContext:
        {{- include "openoju.podSecurityContext" . | nindent 8 }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      containers:
        - name: worker
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          image: "{{ include "openoju.image" . }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "-m", "app.worker"]
          {{- include "openoju.env" . | nindent 10 }}
          volumeMounts:
            {{- include "openoju.volumeMounts" . | nindent 12 }}
            {{- include "openoju.vaapiMount" . | nindent 12 }}
          resources:
            {{- toYaml .Values.resources.worker | nindent 12 }}
      volumes:
        {{- include "openoju.volumes" . | nindent 8 }}
        {{- include "openoju.vaapiVolume" . | nindent 8 }}
      {{- include "openoju.scheduling" . | nindent 6 }}
