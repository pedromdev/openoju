apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "openoju.fullname" . }}-dispatcher
  labels:
    {{- include "openoju.labels" . | nindent 4 }}
    app.kubernetes.io/component: dispatcher
spec:
  replicas: {{ .Values.replicaCount.dispatcher }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "openoju.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: dispatcher
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "openoju.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: dispatcher
    spec:
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      containers:
        - name: dispatcher
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "-m", "app.dispatcher"]
          envFrom:
            - configMapRef:
                name: {{ include "openoju.configMapName" . }}
            - secretRef:
                name: {{ .Values.existingSecret }}
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: media
              mountPath: /media
          resources:
            {{- toYaml .Values.resources.dispatcher | nindent 12 }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "openoju.dataClaim" . }}
        - name: media
          persistentVolumeClaim:
            claimName: {{ include "openoju.mediaClaim" . }}
