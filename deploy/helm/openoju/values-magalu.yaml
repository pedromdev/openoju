# =============================================================================
# Magalu Cloud (experimental): MKE + DBaaS PostgreSQL + Object Storage (S3)
#
# Sem ReadWriteMany: use emptyDir e storage_backend=s3 (padrão do preset).
# O Ingress usa ingress-nginx; o Service pode ser exposto também pelo addon
# de load balancer do cluster.
# =============================================================================

replicaCount:
  api: 2
  worker: 2
  dispatcher: 1
  maintenance: 1

secrets:
  create: false

config:
  OJU_PUBLIC_BASE_URL: https://openoju.example.com
  OJU_FRONTEND_BASE_URL: https://openoju.example.com
  OJU_CORS_ORIGINS: https://openoju.example.com
  OJU_STORAGE_BACKEND: s3
  # Endpoint S3 do Object Storage da Magalu (região br-se1).
  OJU_S3_ENDPOINT: https://br-se1.magaluobjects.com
  OJU_S3_INTERNAL_ENDPOINT: https://br-se1.magaluobjects.com
  OJU_S3_BUCKET: openoju
  OJU_S3_REGION: br-se1
  OJU_S3_CREATE_BUCKET: "false"
  OJU_RATE_LIMIT_BACKEND: postgres

media:
  mode: emptyDir
  emptyDir:
    sizeLimit: 50Gi

data:
  mode: emptyDir

vaapi:
  enabled: false

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
  hosts:
    - host: openoju.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - hosts: [openoju.example.com]
      secretName: openoju-tls

pdb:
  enabled: true

nodeSelector:
  openoju.io/pool: app

networkPolicy:
  enabled: true
  allowDNS: true
