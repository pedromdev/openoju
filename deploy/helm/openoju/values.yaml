replicaCount:
  api: 1
  worker: 1
  dispatcher: 1
  maintenance: 1

image:
  repository: ghcr.io/pedromdev/openoju
  tag: "0.3.0"
  pullPolicy: IfNotPresent

# Create with:
# kubectl create secret generic openoju-secrets \
#   --from-literal=OJU_DATABASE_URL=... \
#   --from-literal=OJU_SECRET_KEY=... \
#   --from-literal=OJU_FERNET_KEY=... \
#   --from-literal=OJU_SETUP_TOKEN=... \
#   --from-literal=OJU_S3_ACCESS_KEY=... \
#   --from-literal=OJU_S3_SECRET_KEY=... \
#   --from-literal=OJU_OIDC_CLIENT_SECRET=...
existingSecret: openoju-secrets

config:
  OJU_DATA_DIR: /app/data
  OJU_MEDIA_ROOT: /media
  OJU_PUBLIC_BASE_URL: https://openoju.example.com
  OJU_FRONTEND_BASE_URL: https://openoju.example.com
  OJU_CORS_ORIGINS: https://openoju.example.com
  OJU_COOKIE_SECURE: "true"
  OJU_CSRF_ENABLED: "true"
  OJU_SESSION_TTL_HOURS: "720"
  OJU_STORAGE_BACKEND: s3
  OJU_S3_ENDPOINT: https://s3.openoju.example.com
  OJU_S3_INTERNAL_ENDPOINT: http://minio.minio.svc.cluster.local:9000
  OJU_S3_BUCKET: openoju
  OJU_S3_REGION: us-east-1
  OJU_S3_PART_SIZE: "16777216"
  OJU_OIDC_ENABLED: "false"
  OJU_OIDC_ISSUER: ""
  OJU_OIDC_CLIENT_ID: ""
  OJU_OIDC_REDIRECT_URI: https://openoju.example.com/api/v1/auth/oidc/callback
  OJU_RETENTION_MEDIA_DAYS: "30"
  OJU_RETENTION_ACCESS_LOG_MONTHS: "6"
  OJU_RETENTION_AUDIT_MONTHS: "12"
  OJU_WEBHOOK_ALLOW_HTTP: "false"
  OJU_DISPATCHER_INTERVAL_S: "10"
  OJU_MAINTENANCE_INTERVAL_S: "3600"

media:
  existingClaim: ""
  size: 100Gi
  storageClassName: ""
  accessMode: ReadWriteMany

data:
  existingClaim: ""
  size: 10Gi
  storageClassName: ""
  accessMode: ReadWriteMany

service:
  type: ClusterIP
  port: 8000

ingress:
  enabled: false
  className: nginx
  host: openoju.example.com
  tlsSecret: ""
  annotations: {}

resources:
  api:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
  worker:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: "4"
      memory: 4Gi
  dispatcher:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  maintenance:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

securityContext:
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

nodeSelector: {}
tolerations: []
affinity: {}
