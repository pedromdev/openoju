services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: openoju-keycloak
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: "8080"
      KC_HOSTNAME_STRICT: "false"
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - ./deploy/keycloak/realm-openoju.json:/opt/keycloak/data/import/realm-openoju.json:ro
    networks:
      - internal

networks:
  internal:
    external: true
    name: openoju_internal
